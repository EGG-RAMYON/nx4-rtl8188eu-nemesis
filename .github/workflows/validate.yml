name: Validate source and package

on:
  push:
  pull_request:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Static source and shell syntax checks
        run: python3 tests/test_public_tree.py
      - name: Scan source tree for accidental private data
        run: python3 scripts/audit-public.py
